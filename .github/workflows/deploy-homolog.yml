name: "Deploy Back Homolog"

on:
  push:
    branches:
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VPS_PATH: /root/git-public-api-homolog
  COMPOSE_FILE: docker-compose.homolog.yml

jobs:
  deploy:
    name: "Deploy Homolog"
    runs-on: ubuntu-latest
    environment: homolog

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Configurar chave SSH"
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: "Adicionar VPS ao known_hosts"
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: "Criar estrutura inicial da VPS"
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} << 'EOF'
            mkdir -p /root/git-public-api-homolog
          EOF

      - name: "Enviar arquivos para VPS"
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "api/vendor" \
            --exclude "api/node_modules" \
            --exclude "api/storage/logs/*" \
            --exclude "api/storage/framework/cache/*" \
            --exclude "api/storage/framework/sessions/*" \
            --exclude "api/storage/framework/views/*" \
            ./ root@${{ secrets.VPS_HOST }}:${{ env.VPS_PATH }}/

      - name: "Criar .envs do servidor"
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} << 'EOF'
            cd /root/git-public-api-homolog

            cat > .env << 'ENV_ROOT_EOF'
          ${{ secrets.ENV_ROOT }}
          ENV_ROOT_EOF

            cat > api/.env << 'ENV_API_EOF'
          ${{ secrets.ENV_API }}
          ENV_API_EOF
          EOF

      - name: "Build e deploy containers"
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} << 'EOF'
            set -e

            cd /root/git-public-api-homolog

            docker compose -f docker-compose.homolog.yml pull || true

            # Sobe somente dependências primeiro
            docker compose -f docker-compose.homolog.yml up -d --build db redis

            # Corrige permissões antes do composer
            docker compose -f docker-compose.homolog.yml run --rm --user root app \
              chown -R www-data:www-data /var/www/api

            # Instala vendor automaticamente
            docker compose -f docker-compose.homolog.yml run --rm --user root app \
              composer install --optimize-autoloader --no-interaction

            # Garante permissões Laravel
            docker compose -f docker-compose.homolog.yml run --rm --user root app \
              chmod -R 775 storage bootstrap/cache

            docker compose -f docker-compose.homolog.yml run --rm app \
              php artisan optimize:clear

            docker compose -f docker-compose.homolog.yml run --rm app \
              php artisan key:generate --force || true

            docker compose -f docker-compose.homolog.yml run --rm app \
              php artisan storage:link || true

            docker compose -f docker-compose.homolog.yml run --rm app \
              php artisan migrate --force

            docker compose -f docker-compose.homolog.yml run --rm app \
              php artisan config:cache

            docker compose -f docker-compose.homolog.yml run --rm app \
              php artisan route:cache

            docker compose -f docker-compose.homolog.yml run --rm app \
              php artisan view:cache

            # Agora sim sobe tudo, incluindo queue e scheduler
            docker compose -f docker-compose.homolog.yml up -d --build

            docker compose -f docker-compose.homolog.yml restart nginx queue scheduler || true

            docker compose -f docker-compose.homolog.yml ps
          EOF

      - name: "Verificar containers"
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} << 'EOF'
            docker ps
          EOF

      - name: "Limpeza"
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key