name: "Deploy Back Homolog"

on:
  push:
    branches:
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VPS_PATH: /root/git-public-api-homolog
  COMPOSE_FILE: docker-compose.homolog.yml

jobs:
  deploy:
    name: "Deploy Homolog"
    runs-on: ubuntu-latest
    environment: homolog

    steps:
      - name: "Checkout do código"
        uses: actions/checkout@v4

      # Otimização de Segurança: O bloco 'trap' destrói o arquivo da chave mesmo se o rsync cair no meio
      - name: "Deploy via RSync Homolog"
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > deploy_key
          chmod 600 deploy_key
          trap 'rm -f deploy_key' EXIT

          ssh -i deploy_key -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} \
            "mkdir -p ${{ env.VPS_PATH }}"

          rsync -az --delete \
            -e "ssh -i deploy_key -o StrictHostKeyChecking=no" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "api/vendor" \
            --exclude "api/node_modules" \
            --exclude "api/storage/logs/*" \
            --exclude "api/storage/framework/cache/*" \
            --exclude "api/storage/framework/sessions/*" \
            --exclude "api/storage/framework/views/*" \
            ./ root@${{ secrets.VPS_HOST }}:${{ env.VPS_PATH }}/

      - name: "Build e Comandos Laravel Homolog"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /root/git-public-api-homolog

            mkdir -p api

            cat > .env << 'ENV_ROOT_EOF'
            ${{ secrets.ENV_ROOT }}
            ENV_ROOT_EOF

            cat > api/.env << 'ENV_API_EOF'
            ${{ secrets.ENV_API }}
            ENV_API_EOF

            chmod 600 .env api/.env

            sed -i 's/\r//' docker/nginx/conf.d/homolog.conf || true

            dc() {
              docker compose --env-file .env -f docker-compose.homolog.yml "$@"
            }

            dc pull || true

            # Otimização de Velocidade: Sobe toda a infraestrutura base de uma só vez
            dc up -d --build

            # Otimização de Velocidade: Substituído 'dc run --rm' por 'dc exec -T' (ganho de ~2 minutos no deploy)
            dc exec -T -u root app mkdir -p \
              /var/www/api/storage/framework/cache/data \
              /var/www/api/storage/framework/sessions \
              /var/www/api/storage/framework/views \
              /var/www/api/bootstrap/cache

            dc exec -T -u root app chown -R www-data:www-data \
              /var/www/api/storage \
              /var/www/api/bootstrap/cache \
              /var/www/api

            dc exec -T -u root app chmod -R 775 \
              /var/www/api/storage \
              /var/www/api/bootstrap/cache

            dc exec -T -u root app composer install \
              --no-interaction \
              --optimize-autoloader \
              --working-dir=/var/www/api

            dc exec -T -u root app php /var/www/api/artisan optimize:clear

            dc exec -T -u root app php /var/www/api/artisan key:generate --force || true

            dc exec -T -u root app php /var/www/api/artisan storage:link --quiet || true

            dc exec -T -u root app php /var/www/api/artisan migrate --force

            dc exec -T -u root app php /var/www/api/artisan optimize

            dc exec -T -u root app chown -R www-data:www-data \
              /var/www/api/storage \
              /var/www/api/bootstrap/cache

            dc exec -T -u root app chmod -R 775 \
              /var/www/api/storage \
              /var/www/api/bootstrap/cache

            dc up -d --build --force-recreate

            dc exec -T -u root app php /var/www/api/artisan queue:restart || true

            dc restart nginx queue scheduler || true

            dc ps
