name: "Deploy Back Production"

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VPS_PATH: /root/git-public-api-production
  COMPOSE_FILE: docker-compose.production.yml

jobs:
  deploy:
    name: "Deploy Production"
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: "Checkout do código"
        uses: actions/checkout@v4

      # Cria arquivo temporário da chave SSH
      - name: "Configurar chave SSH"
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > deploy_key
          chmod 600 deploy_key

      # Correção: Adicionado -T e -o StrictHostKeyChecking=no
      - name: "Criar estrutura inicial da VPS"
        run: |
          ssh -T -i deploy_key -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} << 'EOF'
            mkdir -p /root/git-public-api-production
          EOF

      # Envia os arquivos do projeto para VPS
      - name: "Enviar arquivos para VPS"
        run: |
          rsync -az --delete \
            -e "ssh -i deploy_key -o StrictHostKeyChecking=no" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "api/vendor" \
            --exclude "api/node_modules" \
            --exclude "api/storage/logs/*" \
            --exclude "api/storage/framework/cache/*" \
            --exclude "api/storage/framework/sessions/*" \
            --exclude "api/storage/framework/views/*" \
            ./ root@${{ secrets.VPS_HOST }}:${{ env.VPS_PATH }}/

      # Correção: Adicionado -T e -o StrictHostKeyChecking=no
      - name: "Criar .envs do servidor"
        run: |
          ssh -T -i deploy_key -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} << 'EOF'
            cd /root/git-public-api-production
            echo '${{ secrets.ENV_ROOT }}' > .env
            echo '${{ secrets.ENV_API }}' > api/.env
          EOF

      # Executa deploy docker e bootstrap Laravel
      # Correção: Adicionado -T e -o StrictHostKeyChecking=no
      # Nota: Substituído o serviço 'api' por 'app' conforme seu docker-compose local
      - name: "Build e deploy containers"
        run: |
          ssh -T -i deploy_key -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} << 'EOF'
            set -e

            cd /root/git-public-api-production

            docker compose -f docker-compose.production.yml pull || true
            docker compose -f docker-compose.production.yml up -d --build

            echo "Aguardando inicialização dos containers..."
            sleep 15

            docker compose -f docker-compose.production.yml exec -T app \
              composer install --no-dev --optimize-autoloader --no-interaction

            docker compose -f docker-compose.production.yml exec -T app \
              php /var/www/api/artisan optimize:clear

            docker compose -f docker-compose.production.yml exec -T app \
              php /var/www/api/artisan key:generate --force || true

            docker compose -f docker-compose.production.yml exec -T app \
              chmod -R 775 /var/www/api/storage /var/www/api/bootstrap/cache

            docker compose -f docker-compose.production.yml exec -T app \
              php /var/www/api/artisan storage:link || true

            docker compose -f docker-compose.production.yml exec -T app \
              php /var/www/api/artisan migrate --force

            docker compose -f docker-compose.production.yml exec -T app \
              php /var/www/api/artisan config:cache

            docker compose -f docker-compose.production.yml exec -T app \
              php /var/www/api/artisan route:cache

            docker compose -f docker-compose.production.yml exec -T app \
              php /var/www/api/artisan view:cache

            docker compose -f docker-compose.production.yml restart app nginx
          EOF

      # Correção: Adicionado -T e -o StrictHostKeyChecking=no
      - name: "Verificar containers"
        run: |
          ssh -T -i deploy_key -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} << 'EOF'
            docker compose -f docker-compose.production.yml ps
          EOF

      # Remove chave privada temporária com segurança garantida
      - name: "Limpeza"
        if: always()
        run: |
          rm -f deploy_key
