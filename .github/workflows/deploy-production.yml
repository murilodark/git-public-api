name: "Deploy Back Production"

# Dispara o deploy automaticamente quando houver push na branch main
on:
  push:
    branches:
      - main

# Variáveis globais do workflow
env:
  # Compatibilidade do GitHub Actions com Node 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # Caminho onde o projeto ficará na VPS
  VPS_PATH: /root/git-public-api-production

  # Arquivo docker compose utilizado no ambiente production
  COMPOSE_FILE: docker-compose.production.yml

jobs:
  deploy:
    # Nome visual do job no GitHub Actions
    name: "Deploy Production"

    # Runner Linux do GitHub
    runs-on: ubuntu-latest

    # Usa os secrets do environment production
    environment: production

    steps:
      # Faz checkout do repositório
      - name: "Checkout"
        uses: actions/checkout@v4

      # Cria arquivo temporário da chave SSH
      - name: "Configurar chave SSH"
        run: |
          # Salva a chave privada enviada via GitHub Secrets
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > deploy_key

          # Ajusta permissão obrigatória do SSH
          chmod 600 deploy_key

      # Adiciona fingerprint da VPS no known_hosts
      - name: "Adicionar VPS ao known_hosts"
        run: |
          # Evita prompt de confirmação SSH
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # Cria diretório inicial do projeto na VPS
      - name: "Criar estrutura inicial da VPS"
        run: |
          ssh -i deploy_key root@${{ secrets.VPS_HOST }} << 'EOF'

            # Cria pasta raiz do projeto caso não exista
            mkdir -p /root/git-public-api-production

          EOF

      # Envia os arquivos do projeto para VPS
      - name: "Enviar arquivos para VPS"
        run: |
          rsync -az --delete \
            -e "ssh -i deploy_key" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "api/vendor" \
            --exclude "api/node_modules" \
            --exclude "api/storage/logs/*" \
            --exclude "api/storage/framework/cache/*" \
            --exclude "api/storage/framework/sessions/*" \
            --exclude "api/storage/framework/views/*" \
            ./ root@${{ secrets.VPS_HOST }}:${{ env.VPS_PATH }}/

      # Cria os arquivos .env automaticamente na VPS
      - name: "Criar .envs do servidor"
        run: |
          ssh -i deploy_key root@${{ secrets.VPS_HOST }} << 'EOF'

            # Entra na pasta do projeto
            cd /root/git-public-api-production

            # Cria .env raiz utilizado pelo docker/infra
            echo '${{ secrets.ENV_ROOT }}' > .env

            # Cria .env da aplicação Laravel
            echo '${{ secrets.ENV_API }}' > api/.env

          EOF

      # Executa deploy docker e bootstrap Laravel
      - name: "Build e deploy containers"
        run: |
          ssh -i deploy_key root@${{ secrets.VPS_HOST }} << 'EOF'

            # Interrompe execução caso algum comando falhe
            set -e

            # Entra na pasta do projeto
            cd /root/git-public-api-production

            # Atualiza imagens caso existam imagens remotas
            docker compose -f docker-compose.production.yml pull || true

            # Faz build e sobe containers
            docker compose -f docker-compose.production.yml up -d --build

            # Aguarda containers iniciarem corretamente
            sleep 15

            # Instala dependências PHP de produção
            docker compose -f docker-compose.production.yml exec -T api \
              composer install --no-dev --optimize-autoloader --no-interaction

            # Limpa caches antigos Laravel
            docker compose -f docker-compose.production.yml exec -T api \
              php artisan optimize:clear

            # Gera APP_KEY caso ainda não exista
            docker compose -f docker-compose.production.yml exec -T api \
              php artisan key:generate --force || true

            # Ajusta permissões Laravel
            docker compose -f docker-compose.production.yml exec -T api \
              chmod -R 775 storage bootstrap/cache

            # Cria symlink storage/public
            docker compose -f docker-compose.production.yml exec -T api \
              php artisan storage:link || true

            # Executa migrations em produção
            docker compose -f docker-compose.production.yml exec -T api \
              php artisan migrate --force

            # Gera cache de configurações
            docker compose -f docker-compose.production.yml exec -T api \
              php artisan config:cache

            # Gera cache de rotas
            docker compose -f docker-compose.production.yml exec -T api \
              php artisan route:cache

            # Gera cache de views
            docker compose -f docker-compose.production.yml exec -T api \
              php artisan view:cache

            # Reinicia containers principais
            docker compose -f docker-compose.production.yml restart api nginx

          EOF

      # Exibe containers ativos na VPS
      - name: "Verificar containers"
        run: |
          ssh -i deploy_key root@${{ secrets.VPS_HOST }} << 'EOF'

            # Lista containers ativos
            docker ps

          EOF

      # Remove chave privada temporária
      - name: "Limpeza"
        if: always()
        run: |
          # Remove arquivo da chave SSH
          rm -f deploy_key