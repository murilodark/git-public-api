name: "Deploy Back Production"

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VPS_PATH: /root/git-public-api-production
  COMPOSE_FILE: docker-compose.production.yml

jobs:
  deploy:
    name: "Deploy Production"
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: "Checkout do código"
        uses: actions/checkout@v4

      # Otimização: Uso de trap garante a exclusão da chave mesmo se o rsync falhar
      - name: "Deploy via RSync Production"
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > deploy_key
          chmod 600 deploy_key
          trap 'rm -f deploy_key' EXIT

          ssh -i deploy_key -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} \
            "mkdir -p ${{ env.VPS_PATH }}"

          rsync -az --delete \
            -e "ssh -i deploy_key -o StrictHostKeyChecking=no" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "api/vendor" \
            --exclude "api/node_modules" \
            --exclude "api/storage/logs/*" \
            --exclude "api/storage/framework/cache/*" \
            --exclude "api/storage/framework/sessions/*" \
            --exclude "api/storage/framework/views/*" \
            ./ root@${{ secrets.VPS_HOST }}:${{ env.VPS_PATH }}/

      - name: "Build e Comandos Laravel Production"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd ${{ env.VPS_PATH }}

            # Garante a existência da subpasta antes da escrita do .env
            mkdir -p api

            # Escrita segura dos arquivos de ambiente
            cat > .env << 'ENV_ROOT_EOF'
            ${{ secrets.ENV_ROOT }}
            ENV_ROOT_EOF

            cat > api/.env << 'ENV_API_EOF'
            ${{ secrets.ENV_API }}
            ENV_API_EOF

            chmod 600 .env api/.env

            # Correção de quebra de linha de scripts/configs do Windows
            sed -i 's/\r//' docker/nginx/conf.d/production.conf || true

            # Atalho para o comando docker compose unificado
            dc() {
              docker compose --env-file .env -f ${{ env.COMPOSE_FILE }} "$@"
            }

            echo "=> Atualizando imagens e subindo a infraestrutura..."
            dc pull || true
            dc up -d --build

            ...

            echo "=> Criando estruturas de pastas internas requeridas pelo Laravel..."
            dc exec -T -u root app mkdir -p \
              /var/www/api/storage/framework/cache/data \
              /var/www/api/storage/framework/sessions \
              /var/www/api/storage/framework/views \
              /var/www/api/storage/logs \
              /var/www/api/bootstrap/cache

            echo "=> Ajustando permissões de escrita (apenas nas pastas necessárias)..."
            dc exec -T -u root app chown -R www-data:www-data /var/www/api/storage /var/www/api/bootstrap/cache
            dc exec -T -u root app chmod -R 775 /var/www/api/storage /var/www/api/bootstrap/cache

            echo "=> Gerenciando dependências do PHP com Composer (Modo Produção)..."
            dc exec -T -u root app composer install \
              --no-dev \
              --no-interaction \
              --optimize-autoloader \
              --working-dir=/var/www/api

            echo "=> Limpando caches antigos do Artisan..."
            dc exec -T -u root app php /var/www/api/artisan optimize:clear

            echo "=> Criando links simbólicos de storage..."
            dc exec -T -u root app php /var/www/api/artisan storage:link --quiet || true

            echo "=> Executando as migrações do banco de dados..."
            dc exec -T -u root app php /var/www/api/artisan migrate --force

            echo "=> Gerando novos caches de performance do Laravel..."
            dc exec -T -u root app php /var/www/api/artisan optimize

            echo "=> Forçando recriação/releitura limpa dos containers de microsserviços..."
            dc up -d --force-recreate app nginx queue scheduler

            echo "=> Reiniciando workers do ecossistema Laravel..."
            dc exec -T -u root app php /var/www/api/artisan queue:restart || true
            dc restart nginx queue scheduler || true

            echo "=> Status atual dos containers em produção:"
            dc ps
